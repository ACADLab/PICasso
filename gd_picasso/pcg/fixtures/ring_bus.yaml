# Ring-bus probe: bus through a DC coupler + IR-only same-instance feedback.
# GF rejects cyclical connections (dc→dc), so feedback lives under
# info.pcg_ir_connections (GF Netlist.info is permitted; top-level extras are not).
# Bus Y aligned to coupler o1/o4 (y≈-1.65 for gap=0.2) so route_bundle clears.
instances:
  dc:
    component: coupler
    settings: {gap: 0.2, length: 10}
  bus_in:
    component: straight
    settings: {length: 20}
  bus_out:
    component: straight
    settings: {length: 20}

placements:
  bus_in:
    x: 0
    y: -1.65
    rotation: 0
    mirror: false
  dc:
    x: 80
    y: 0
    rotation: 0
    mirror: false
  bus_out:
    x: 200
    y: -1.65
    rotation: 0
    mirror: false

routes:
  optical:
    settings:
      cross_section: strip
      radius: 10.0
    links:
      bus_in,o2: dc,o1
      dc,o4: bus_out,o1

info:
  pcg_ir_connections:
    dc,o3: dc,o2

ports:
  in: bus_in,o1
  out: bus_out,o2

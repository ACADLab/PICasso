# Dual-arm MZI with deliberately unbalanced arm placements.
# Append-only Place-spike fixture: stock mzi.yaml is geometrically symmetric,
# so λ_φ ablation is a no-op there. This seed skews upper/lower path lengths
# so W_cos+D-only vs +λ_φ can diverge (ESTIMATOR_ONLY).
# Same west/east split-bundle topology as mzi.yaml (gf 9.23 angle rule).
instances:
  splitter:
    component: mmi1x2
    settings: {}
  ps_upper:
    component: straight_heater_metal
    settings: {length: 100}
  ps_lower:
    component: straight
    settings: {length: 100}
  combiner:
    component: mmi1x2
    settings: {}

placements:
  splitter:
    x: 0
    y: 0
    rotation: 0
    mirror: false
  ps_upper:
    x: 120
    y: 90
    rotation: 0
    mirror: false
  ps_lower:
    x: 200
    y: -35
    rotation: 0
    mirror: false
  combiner:
    x: 380
    y: 10
    rotation: 180
    mirror: false

routes:
  west:
    settings:
      cross_section: strip
      radius: 10.0
    links:
      splitter,o2: ps_upper,o1
      splitter,o3: ps_lower,o1
  east:
    settings:
      cross_section: strip
      radius: 10.0
    links:
      ps_upper,o2: combiner,o2
      ps_lower,o2: combiner,o3

ports:
  in: splitter,o1
  out: combiner,o1

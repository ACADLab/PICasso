[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "picasso"
version = "0.1.0"
description = "PICasso - AI-powered Photonic Integrated Circuit design automation with YAML DSL and validation"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "PICasso Contributors" }
]
keywords = ["photonics", "gdsfactory", "llm", "yaml", "pic", "integrated-circuit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "pyyaml>=6.0",
    "gdsfactory==9.23.0",
    "sax>=0.14.0",
    "pydantic>=2.0.0",
    "openai>=1.0.0",
    "anthropic>=0.34.0",
    "google-generativeai>=0.8.0",
    "huggingface-hub>=0.17.0",
    "tqdm>=4.60.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
full = [
    "picasso[dev]",
    "gplugins[schematic,femwell,meow,sax,tidy3d]>=1.2.4",
    "jax>=0.4.35",
    "jaxlib>=0.4.35",
    "klujax>=0.3.1",
    "klayout>=0.28.0",
    "matplotlib>=3.4.0",
    "pandas>=1.3.0",
    "transformers>=4.30.0",
    "requests>=2.28.0",
    "xmltodict>=0.13.0",
]

[project.urls]
Repository = "https://github.com/your-org/PICasso"
Documentation = "https://github.com/your-org/PICasso#readme"

[tool.setuptools.packages.find]
where = ["."]
include = ["gd_picasso*"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
]
